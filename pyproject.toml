[project]
name = "egregora-audio-super-resolution"
description = "✨High‑quality music audio enhancement for ComfyUI: FlashSR Super‑Resolution + Fat Llama spectral enhancement (GPU & CPU)."
version = "1.0.0"
license = {file = "LICENSE"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

# Must be valid PEP 508 specifiers: no comment lines, no trailing '#' comments.
# Keep in sync with requirements.txt, which carries the explanatory notes.
# CuPy is intentionally absent -- the right wheel depends on torch's CUDA major,
# so install.py:ensure_cupy() selects it at install time.
dependencies = [
    "numpy>=1.26,<2.6",
    "scipy>=1.11",
    "soundfile>=0.12",
    "tqdm>=4.66",
    "requests>=2.31",
    "huggingface_hub>=0.24",
    "fat-llama>=1.1.0",
    "fat-llama-fftw>=1.0.4.4",
    "pyrnnoise>=0.3.8",
    "nara-wpe>=0.0.9",
    "deepfilternet>=0.5.6",
    "descript-audio-codec>=1.0.0",
]

[project.urls]
Repository = "https://github.com/lucasgattas/ComfyUI-Egregora-Audio-Super-Resolution"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/lucasgattas/ComfyUI-Egregora-Audio-Super-Resolution/wiki"
"Bug Tracker" = "https://github.com/lucasgattas/ComfyUI-Egregora-Audio-Super-Resolution/issues"

[tool.comfy]
PublisherId = "mrgattax"
DisplayName = "ComfyUI-Egregora-Audio-Super-Resolution"
Icon = ""
includes = [] 
